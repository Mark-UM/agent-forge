name: CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  security-contracts:
    name: Security and service contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install test runner
        run: python -m pip install --upgrade pip pytest

      - name: Compile first-party modules
        run: python -m compileall -q modules

      - name: Run security and service regression tests
        run: >-
          python -m pytest -q
          modules/common/tests/test_security.py
          modules/mcp/tests/test_sqlite_read_only.py
          modules/mcp/tests/test_secure_fetch_mcp.py
          modules/browser/tests/test_daemon_security.py
          modules/orchestrator/tests/test_collection_security.py
          modules/search/tests/test_hardened_service.py

  full-test-suite:
    name: Full suite (${{ matrix.os }})
    needs: security-contracts
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip pytest -r requirements.txt

      - name: Compile first-party modules
        run: python -m compileall -q modules

      - name: Validate capability manifests
        run: python -m modules.registry validate

      - name: Run complete pytest suite
        run: python -m pytest -q
