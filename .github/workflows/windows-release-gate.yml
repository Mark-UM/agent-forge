name: Windows release gate

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  source-validation:
    name: Windows source validation and exact report
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip pytest -r requirements.txt

      - name: Compile first-party modules
        run: python -m compileall -q modules

      - name: Validate capability manifests strictly
        run: python -m modules.registry validate --strict

      - name: Enforce Model Gateway ownership
        run: python -m modules.dispatch.no_bypass

      - name: Run complete Windows pytest suite
        run: >-
          python -m pytest -q
          -W error::pytest.PytestUnhandledThreadExceptionWarning
          --junitxml=_runtime/test-results/windows-pytest.xml

      - name: Render exact Windows test reports
        if: always()
        run: >-
          python scripts/render_windows_test_report.py
          --junit _runtime/test-results/windows-pytest.xml
          --commit "${{ github.sha }}"
          --run-id "${{ github.run_id }}"
          --markdown _runtime/test-results/TEST_REPORT.generated.md
          --json _runtime/test-results/report.json

      - name: Upload exact Windows test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-windows-test-results
          path: _runtime/test-results
          if-no-files-found: warn
          retention-days: 14

  clean-runtime-smoke:
    name: Clean Windows Vendor, Chromium, and Supervisor smoke
    needs: source-validation
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Install and smoke the local Windows runtime
        shell: powershell
        run: ./scripts/windows-release-smoke.ps1

      - name: Upload Supervisor logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-windows-supervisor-smoke-logs
          path: _runtime/supervisor/logs
          if-no-files-found: warn
          retention-days: 14
